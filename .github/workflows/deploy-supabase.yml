# Asosiy shoxga (PR birlashtirilganda) supabase/ o'zgarsa: yangi migratsiyalar va Edge Function'lar
# Supabase'ga o'zi chiqadi. Kompyuterda supabase\update.ps1 ishga tushirish shart emas.
# Qo'lda ham ishga tushirsa bo'ladi: GitHub -> Actions -> "Supabase deploy" -> Run workflow.
# Kerakli sirlar (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN - supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD  - loyiha yaratishda o'ylangan ma'lumotlar bazasi paroli
name: Supabase deploy

on:
  push:
    paths:
      - supabase/migrations/**
      - supabase/functions/**
      - supabase/config.toml
      - .github/workflows/deploy-supabase.yml
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ekerylabzdsouhyawtcp

jobs:
  deploy:
    name: Migratsiyalar va funksiyalar
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Sirlar bormi
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN yoki SUPABASE_DB_PASSWORD sirlari qo'shilmagan (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      # Supabase CLI npm'dan (supabase/setup-cli "latest"ni GitHub API'dan so'raydi va tez-tez "rate limit exceeded"
      # bilan to'xtaydi — 5-noyabr). npm paketi binarni releases'dan yuklaydi (API cheklovi yo'q)
      - name: Supabase CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/sb" --no-audit --no-fund supabase@latest
          echo "$RUNNER_TEMP/sb/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sb/node_modules/.bin/supabase" --version
      - name: Loyihani ulash
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Jadvallar (yangi migratsiyalar)
        # Yangi CLI (v3+) standart bo'yicha mahalliy bazaga yozadi — ulangan loyihani aniq ko'rsatamiz
        # (yangisida --remote, eskisida --linked)
        run: |
          if supabase db push --help 2>&1 | grep -q -- '--remote'; then TARGET=--remote; else TARGET=--linked; fi
          supabase db push $TARGET --yes --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Server funksiyalari
        run: supabase functions deploy --yes --use-api --project-ref "$SUPABASE_PROJECT_REF"
      # Kirish kodlari chegarasi: Supabase standarti — butun loyiha uchun soatiga 30 ta SMS/bot kodi.
      # Yuklama sinovi (supabase/tests/load): 200 kishi bir soatda birinchi marta kirsa, 31-chisidan "juda ko'p so'rov".
      # Kamida SMS_PER_HOUR qilinadi (kattaroq bo'lsa tegilmaydi). Bitta raqamga baribir 60 s da bir marta.
      - name: Kirish kodlari chegarasi (soatiga)
        continue-on-error: true
        env:
          SMS_PER_HOUR: 300
        run: |
          API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          CUR=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API" | jq -r '.rate_limit_sms_sent // empty')
          echo "Hozir: soatiga ${CUR:-?} ta kod"
          if [ -n "$CUR" ] && [ "$CUR" -lt "$SMS_PER_HOUR" ]; then
            curl -sf -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "{\"rate_limit_sms_sent\": $SMS_PER_HOUR}" "$API" | jq '{rate_limit_sms_sent}'
          fi
      # Email orqali ro'yxatdan o'tish: email tasdiqlanmasa hisob ochilmaydi (telefonsiz soxta hisoblarga qarshi).
      # Telegram orqali kirish yashirin emailni server o'zi tasdiqlaydi (email_confirm) — unga ta'sir qilmaydi.
      # docs/xavfsizlik-auditi-3.md → P3
      - name: Email tasdiqlash majburiy
        continue-on-error: true
        run: |
          API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          AUTO=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API" | jq -r '.mailer_autoconfirm // empty')
          echo "Hozir: mailer_autoconfirm=${AUTO:-?}"
          if [ "$AUTO" = "true" ]; then
            curl -sf -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d '{"mailer_autoconfirm": false}' "$API" | jq '{mailer_autoconfirm}'
          fi
