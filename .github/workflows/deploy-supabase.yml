# Asosiy shoxga (PR birlashtirilganda) supabase/ o'zgarsa: yangi migratsiyalar va Edge Function'lar
# Supabase'ga o'zi chiqadi. Kompyuterda supabase\update.ps1 ishga tushirish shart emas.
# Qo'lda ham ishga tushirsa bo'ladi: GitHub -> Actions -> "Supabase deploy" -> Run workflow.
# Kerakli sirlar (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN - supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD  - loyiha yaratishda o'ylangan ma'lumotlar bazasi paroli
name: Supabase deploy

on:
  push:
    paths:
      - supabase/migrations/**
      - supabase/functions/**
      - supabase/config.toml
      - .github/workflows/deploy-supabase.yml
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ekerylabzdsouhyawtcp

jobs:
  deploy:
    name: Migratsiyalar va funksiyalar
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Sirlar bormi
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN yoki SUPABASE_DB_PASSWORD sirlari qo'shilmagan (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Loyihani ulash
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Jadvallar (yangi migratsiyalar)
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Server funksiyalari
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"
