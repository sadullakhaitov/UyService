# Har kecha bazaning zaxira nusxasi (Supabase bepul tarifida kunlik zaxira yo'q).
# Rollar, tuzilma va ma'lumotlar (`supabase db dump`) shifrlanib (AES-256, kalit - SUPABASE_DB_PASSWORD)
# Actions artifakti bo'lib 30 kun saqlanadi. Repo ochiq bo'lgani uchun shifrsiz hech narsa yuklanmaydi.
# Storage fayllari (pasport/selfi, ish namunalari, buyurtma rasmlari) ham shu arxivga kiradi (storage/<bucket>/).
# Tiklash tartibi - supabase/README.md, 21-bo'lim.
# Ochish: gpg --batch --passphrase "<baza paroli>" -d uyservice-db-SANA.tar.gz.gpg | tar -xz
name: Baza zaxirasi

on:
  schedule:
    - cron: '30 21 * * *' # har kuni 02:30 (Toshkent)
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ekerylabzdsouhyawtcp

jobs:
  backup:
    name: Zaxira
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Sirlar bormi
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN yoki SUPABASE_DB_PASSWORD sirlari qo'shilmagan."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Loyihani ulash
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Nusxa olish
        run: |
          mkdir -p backup
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --role-only -f backup/roles.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f backup/schema.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f backup/data.sql
          ls -la backup
          test -s backup/schema.sql
      - name: Fayllar (Storage)
        run: |
          for b in documents works order-photos; do
            mkdir -p "backup/storage/$b"
            if ! supabase storage cp -r "ss:///$b/" "backup/storage/$b" --experimental --linked; then
              echo "::warning::Storage '$b' papkasini nusxalab bo'lmadi"
            fi
          done
          find backup/storage -type f | wc -l
      - name: Shifrlash
        run: |
          echo "DAY=$(TZ=Asia/Tashkent date +%F)" >> "$GITHUB_ENV"
          tar -czf - -C backup . | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$SUPABASE_DB_PASSWORD" -o db.tar.gz.gpg
          rm -rf backup
          ls -la db.tar.gz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: uyservice-db-${{ env.DAY }}
          path: db.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
